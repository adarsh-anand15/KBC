name: Cloudflare KV one-time setup

on:
  workflow_dispatch:

jobs:
  create-namespace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create KBC_DATA KV namespace (no-op if it already exists)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: kv namespace create KBC_DATA
